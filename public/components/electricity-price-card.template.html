<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css">

<article class="card flex-fill">
	<div class="card-stamp">
		<div class="card-stamp-icon bg-blue">
			<i class="ti ti-coin-euro"></i>
		</div>
	</div>
	<div class="card-body">
		<span class="text-dark float-end h6">
			<span id="min-time">-</span>&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-success">
			<i class="ti ti-math-min"></i>&nbsp;<span id="min-val">-</span>
		</span>
	</div>
	<div class="card-body">
		<span class="text-muted float-end h6">
			&dash;&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-primary">
			<i class="ti ti-math-avg"></i>&nbsp;<span id="avg-val">-</span>
		</span>
	</div>
	<div class="card-body">
		<span class="text-muted float-end h6">
			<span id="max-time">-</span>&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-danger">
			<i class="ti ti-math-max"></i>&nbsp;<span id="max-val">-</span>
		</span>
	</div>
</article>
