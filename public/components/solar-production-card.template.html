<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css">

<article class="card flex-fill">
	<div class="card-stamp">
		<div class="card-stamp-icon bg-yellow">
			<i class="ti ti-solar-electricity"></i>
		</div>
	</div>
	<div class="card-body">
		<span class="text-dark float-end h6">
			&dash;&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-danger">
			<i class="ti ti-battery-charging"></i>&nbsp;<span id="total-production-val">!</span>
		</span>
	</div>
	<div class="card-body">
		<span class="text-muted float-end h6">
			<span id="max-power-time">!</span>&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-orange">
			<i class="ti ti-solar-panel-2"></i>&nbsp;<span id="max-power-val">!</span>
		</span>
	</div>
	<div class="card-body">
		<span class="text-muted float-end h6">
			<span id="max-energy-time">!</span>&nbsp;<i class="ti ti-clock"></i>
		</span>
		<span class="card-title text-yellow">
			<i class="ti ti-solar-panel"></i>&nbsp;<span id="max-energy-val">!</span>
		</span>
	</div>
</article>
