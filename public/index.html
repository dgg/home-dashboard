<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Energy Dashboard</title>
	<!-- Fluent UI Web Components v2 -->
	<script type="module" src="https://unpkg.com/@fluentui/web-components@2"></script>
	<!-- Apache ECharts v6.1.0 -->
	<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>	<link rel="stylesheet" href="styles/app.css">
	<style>
		:root {
			--body-bg: #f3f2f1;
		}

		body {
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: var(--body-bg);
			width: 960px;
			height: 476px;
			overflow: hidden;
		}

		main {
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: stretch;
		}

		.dashboard-container {
			width: 100%;
			display: flex;
			flex-direction: column;
		}

		#chart-container {
			flex: 1;
			width: 100%;
		}

		fluent-card {
			padding: 0.5rem 0.75rem;
			height: 100%;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
		}
	</style>
</head>

<body>
	<main>
		<div class="dashboard-container">
			<fluent-card>
				<div id="chart-container"></div>
			</fluent-card>
		</div>
	</main>

	<script type="module" src="scripts/app.js"></script>
</body>

</html>
