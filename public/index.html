<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Energy Dashboard</title>
	<!-- Fluent UI Web Components v2 -->
	<script type="module" src="https://unpkg.com/@fluentui/web-components@2"></script>
	<!-- Apache ECharts v6.1.0 -->
	<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
	<link rel="stylesheet" href="styles/app.css">
	<style>
		:root {
			--body-bg: #f3f2f1;
		}
	</style>
</head>

<body>
	<main>
		<div class="swipe-view">
			<div class="dashboard-container">
				<fluent-card>
					<div id="price-chart-container" class="chart-container"></div>
				</fluent-card>
			</div>
			<div class="dashboard-container">
				<fluent-card>
					<div id="irradiance-chart-container" class="chart-container"></div>
				</fluent-card>
			</div>
			<div class="dashboard-container">
				<fluent-card>
					<div id="production-chart-container" class="chart-container"></div>
				</fluent-card>
			</div>
			<div class="dashboard-container">
				<div id="summary-cards-container" class="summary-container"></div>
			</div>
		</div>
	</main>

	<script type="module" src="scripts/app.js"></script>
</body>

</html>
