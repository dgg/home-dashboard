<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Energy Dashboard</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css"
		integrity="sha256-fvdQvRBUamldCxJ2etgEi9jz7F3n2u+xBn+dDao9HJo=" crossorigin="anonymous">
	<link rel="preconnect" href="https://rsms.me/">
	<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
	<!-- 3.35.0 to be able to use filled icons-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css"
		integrity="sha512-gzw5zNP2TRq+DKyAqZfDclaTG4dOrGJrwob2Fc8xwcJPDPVij0HowLIMZ8c1NefFM0OZZYUUUNoPfcoI5jqudw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="styles/app.css">
</head>

<body>
	<div class="page flex-row">
		<aside class="navbar navbar-vertical navbar-expand-lg nav-minimal" data-bs-theme="dark">
			<div class="container-fluid flex-column px-0">
				<ul class="navbar-nav flex-column pt-3" role="tablist">
					<li class="nav-item mb-2" title="Irradiation" role="presentation">
						<a class="nav-link active" href="#tabs-irradiance" data-bs-toggle="tab" role="tab">
							<h1 class="nav-link-icon">
								<i class="ti ti-sun-filled"></i>
							</h1>
						</a>
					</li>
					<li class="nav-item mb-2" title="Price" role="presentation">
						<a class="nav-link" href="#tabs-price" data-bs-toggle="tab" role="tab">
							<h1 class="nav-link-icon">
								<i class="ti ti-coin-euro-filled"></i>
							</h1>
						</a>
					</li>
					<li class="nav-item mb-2" title="Production" role="presentation">
						<a class="nav-link" href="#tabs-production" data-bs-toggle="tab" role="tab">
							<h1 class="nav-link-icon">
								<i class="ti ti-bolt-filled"></i>
							</h1>
						</a>
					</li>
					<li class="nav-item mb-2" title="Summary" role="presentation">
						<a class="nav-link" href="#tabs-summary" data-bs-toggle="tab" role="tab">
							<h1 class="nav-link-icon">
								<i class="ti ti-clipboard-data"></i>
							</h1>
						</a>
					</li>
				</ul>
			</div>
		</aside>

		<div class="page-wrapper flex-fill">
			<div class="page-body">
				<div class="tab-content h-100">
					<div class="tab-pane fade active show" id="tabs-irradiance" role="tabpanel">
						<div class="align-items-center justify-content-center h-100">
							<article class="card">
								<div class="card-body">
									<h2 class="card-title">Solar Irradiance</h2>
									<div id="chart-irradiance-container" class="chart-container">
										<canvas id="chart-irradiance"></canvas>
									</div>
								</div>
							</article>
						</div>
					</div>
					<div class="tab-pane fade" id="tabs-price" role="tabpanel">
						<div class="align-items-center justify-content-center h-100">
							<article class="card">
								<div class="card-body">
									<h2 class="card-title">Electricity Prices</h2>
									<div id="chart-price-container" class="chart-container">
										<canvas id="chart-price"></canvas>
									</div>
								</div>
							</article>
						</div>
					</div>
					<div class="tab-pane fade" id="tabs-production" role="tabpanel">
						<div class="align-items-center justify-content-center h-100">
							<article class="card">
								<div class="card-body">
									<h2 class="card-title">Energy Production</h2>
									<div id="chart-production-container" class="chart-container">
										<canvas id="chart-production"></canvas>
									</div>
								</div>
							</article>
						</div>
					</div>
					<div class="tab-pane fade" id="tabs-summary" role="tabpanel">
						<div class="row row-cards">
							<div class="col-12">
								<article class="card card-vertical">
									<div class="card-header card-header-vertical">
										<h2 class="card-title">Today</h2>
									</div>
									<div class="card-body">
										<div class="row row-cards">
											<div class="col-2">
												<solar-transit-card id="solar-transit-today" day-index="0" />
											</div>
											<div class="col-3">
												<solar-irradiance-card id="solar-irradiance-today" day-index="0" />
											</div>
											<div class="col-4">
												<electricity-price-card id="electricity-price-today" day-index="0" />
											</div>
											<div class="col-3">
												<solar-production-card id="solar-production-today" day-index="0" />
											</div>
								</article>
							</div>
							<div class="col-12">
								<article class="card card-vertical">
									<div class="card-header card-header-vertical">
										<h2 class="card-title">Tomorrow</h2>
									</div>
									<div class="card-body">
										<div class="row row-cards">
											<div class="col-2">
												<solar-transit-card id="solar-transit-tomorrow" day-index="1" />
											</div>
											<div class="col-3">
												<solar-irradiance-card id="solar-irradiance-tomorrow" day-index="1" />
											</div>
											<div class="col-4">
												<electricity-price-card id="electricity-price-tomorrow" day-index="1" />
											</div>
											<div class="col-3">
												<solar-production-card id="solar-production-tomorrow" day-index="1" />
											</div>
								</article>
							</div>
						</div>
						<last-refresh id="last-refresh" />
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"
		integrity="sha256-tgx2Fg6XYkV027jPEKvmrummSTtgCW/fwV3R3SvZnrk=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
		integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>
	<script type="module" src="scripts/app.mjs"></script>
</body>

</html>
